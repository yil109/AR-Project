<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Library AR Swipe Demo</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin:0; overflow:hidden;">
    <a-scene embedded arjs>

      <!-- <a-marker preset="hiro"> -->
      <a-marker id="markerA" type="pattern" url="marker/pattern-234.patt">


      <!-- PAGE 1 -->
      <a-entity id="p1">

      <a-entity
          gltf-model="url(model/paladins_book.glb)"
          scale="8 8 8  "
          position="-4 -0 0"
          rotation="-90 0 0"
        ></a-entity>

        <!-- <a-plane width="5" height="5" rotation="-90 0 0" color="#FFFFFF"></a-plane> -->

         <a-image
          src="bookbg.png"
          width="4.5"
          height="3"
          rotation="-90 0 0"
          position="0 0.02 0">
        </a-image>

        <a-text
           value="Borrowing Hours:\n9:30-19:00 (Mon-Fri)\nUntil 18:00 (Others)\n\nLimit: 10 books\nLoan: 2 weeks\nOnline reservation\nRenewal at desk\n\nIn-library reading\nReturn at service desk\nMore info at desk"
          rotation="-90 0 0"
          position="0 0.1 0"
          width="4.5"
          align="center"
          color="#4B2E1F">
          scale="1.2 1.2 1.2"
        </a-text>



      </a-entity>

      <!-- PAGE 2 -->
      <a-entity id="p2" visible="false">

        <a-entity
          gltf-model="url(model/bookshelf1.glb)"
          scale="1 1 1 "
          position="-3.3 0 1"
          rotation="-90 0 0"
        ></a-entity>

        <!-- <a-plane rotation="-90 0 0" ></a-plane> -->

        <a-image
          src="second.png"
          width="4.5"
          height="4.5"
          rotation="-90 0 0"
          position="0 0.00 0">
        </a-image>

        <a-text
          value="You can enter \n the academic library \n or borrow books with your \n campus card."
          rotation="-90 0 0"
          position="-3.5 0 2"
          width="4.5"
          align="center"
           scale="1.1 1.1 1.1"
          color="#000">


        </a-text>

      </a-entity>

      <!-- PAGE 3 -->
      <a-entity id="p3" visible="false">


         <a-entity
          gltf-model="url(model/computer.glb)"
          scale="0.0002 0.0002 0.0002"
          position="-3.5 0 0"
          rotation="-90 0 0"
        ></a-entity>


        <a-entity
          gltf-model="url(model/stair.glb)"
          scale="0.5 0.5 0.5 "
          position="-3. 2 2 "
          rotation="-90 0 0"
        ></a-entity>


        <!-- <a-plane  rotation="-90 0 0" ></a-plane> -->

        <a-image
          src="third.png"
          width="4.5"
          height="4.5"
          rotation="-90 0 0"
          position="0 0.02 0">
        </a-image>

        <a-text
          value="Book Search\n\nOPAC System\nLocation: 2F"
          rotation="-90 0 0"
          position="0 -1.2 0"
          width="4.5"
          align="center"
          color="#000">
        </a-text>
      </a-entity>

    </a-marker>
      
      <a-marker id="markerB" preset="custom" type="pattern" url="img/pattern-study-area-marker.patt">

        <!--Background Plan-->
        <a-plane id="bgPlane" src="img/bg_home.jpg" rotation="-90 0 0" width="4" height="3" position="0 0 -1"></a-plane>
        
        <!-- 中心图书馆模型 -->
        <a-entity id="model_home"
                  gltf-model="models/model_home.glb"
                  scale="0.5 0.5 0.5"
                  position="0 0.5 0"
                  rotation="-30 45 0">
        </a-entity>

        <a-entity id="model_public"
                  visible='false'
                  gltf-model="models/model_public.glb"
                  scale="0.5 0.5 0.5"
                  position="0 0.3 0"
                  rotation="-90 0 0">
        </a-entity>

        <a-entity id="model_special"
                  visible='false'
                  gltf-model="models/model_special.glb"
                  scale="0.005 0.005 0.005"
                  position="0 0.5 0.5"
                  rotation="0 90 -90">
        </a-entity>

        <a-entity id="arrowNext"
          gltf-model="models/direction_arrow.glb"
          scale="0.2 0.2 0.2"
          position="1 0.5 0.3"
          rotation="0 0 0">
  
            <a-text 
                    id="arrowNextText"
                    value="Special Library"
                    font="https://cdn.aframe.io/fonts/mozillavr.fnt"
                    color="#ffffff"
                    position="0 1.5 0" 
                    scale="3 3 3" 
                    rotation="-90 0 0"
                    align="center">
            </a-text>
        </a-entity>

        <a-entity id="arrowBack"
          gltf-model="models/direction_arrow.glb"
          scale="0.2 0.2 0.2"
          position="-1 0.5 0.3"
          rotation="0 180 0">
  
            <a-text 
                    id="arrowBackText"
                    value="Public Library"
                    font="https://cdn.aframe.io/fonts/mozillavr.fnt"
                    color="#ffffff"
                    position="0 1.5 0" 
                    scale="3 3 3" 
                    rotation="-90 180 0"
                    align="center">
            </a-text>
        </a-entity>

  
        <a-text 
              id="title"
              value="Study Area Rules"
              font="https://cdn.aframe.io/fonts/mozillavr.fnt"
              color="#212121"
              position="0 0.3 -2" 
              scale="1.7 1.7 1.7" 
              rotation="-90 0 0"
              align="center">
        </a-text>

        <a-text 
              id="message_public"
              visible = 'false'
              value="Public library Rules:\n1.Opening Hours:9:00~20:00\n2.Discussion is allowed\n3.Free book borrowing "
              font="https://cdn.aframe.io/fonts/mozillavr.fnt"
              color="#ffffff"
              position="0 1 -0.1" 
              scale="0.6 0.6 0.6" 
              rotation="-90 0 0"
              align="center">
        </a-text>

        <a-text 
              id="message_special"
              visible = 'false'
              value="Public library Rules:\n1.Opening Hours:9:00~24:00\n2.Discussion prohibited\n3.No food or drink"
              font="https://cdn.aframe.io/fonts/mozillavr.fnt"
              color="#ffffff"
              position="0 1.5 -0.5"
              scale="0.6 0.6 0.6" 
              rotation="-90 0 0"
              align="center">
        </a-text>


      </a-marker>

      <!-- Camera -->
      <a-entity camera></a-entity>

    </a-scene>

    <script>

      let page = 1;
      
      let pageIndex = 0; // 0=主页, 1=公共, 2=专用

      const bg = document.getElementById('bgPlane');

      const model_home = document.getElementById('model_home');
      const model_public = document.getElementById('model_public');
      const model_special = document.getElementById('model_special');

      const arrowNext = document.getElementById('arrowNext');
      const arrowNextText = document.getElementById('arrowNextText');

      const arrowBack = document.getElementById('arrowBack');
      const arrowBackText = document.getElementById('arrowBackText');

      const title = document.getElementById('title');
      const message_public = document.getElementById('message_public');
      const message_special = document.getElementById('message_special');

      function nextPage() {
        page = page % 3 + 1;
        document.querySelector('#p1').setAttribute('visible', page === 1);
        document.querySelector('#p2').setAttribute('visible', page === 2);
        document.querySelector('#p3').setAttribute('visible', page === 3);
      }

      let currentMarker = null;

      const markerA = document.getElementById('markerA');
      const markerB = document.getElementById('markerB');
      
      markerA.addEventListener('markerFound', () => {
        currentMarker = 'A';
        console.log('Marker A found');
      });

      markerA.addEventListener('markerLost', () => {
        if (currentMarker === 'A') currentMarker = null;
      });

      markerB.addEventListener('markerFound', () => {
        currentMarker = 'B';
        console.log('Marker B found');
      });

      markerB.addEventListener('markerLost', () => {
        if (currentMarker === 'B') currentMarker = null;
      });

      document.body.addEventListener('click',(e) => {

        if(currentMarker == 'A'){
          nextPage();
        }

        if(currentMarker == 'B'){
          const clickX = e.clientX;
          const screenWidth = window.innerWidth;

          if(pageIndex == 0){
            if(clickX <= screenWidth / 2){
              pageIndex = 1;
            }else{
              pageIndex = 2;
            }
          }else{
            pageIndex = 0;
          }

          if (pageIndex === 0) {
            bg.setAttribute('src', './img/bg_home.jpg');


            model_home.setAttribute('visible', true);
            model_public.setAttribute('visible', false);
            model_special.setAttribute('visible', false);

            title.setAttribute('value', 'Study Area Rules');

            message_public.setAttribute('visible', false);
            message_special.setAttribute('visible', false);
            
            arrowNext.setAttribute('visible', true);
            arrowBack.setAttribute('visible', true);
            arrowNextText.setAttribute('value', 'Special Library');
            arrowBackText.setAttribute('value', 'Public Library');
          } else if (pageIndex === 1) {
            // 公共图书馆规则页
            bg.setAttribute('src', './img/bg_public.jpg');

            model_home.setAttribute('visible', false);
            model_public.setAttribute('visible', true);
            model_special.setAttribute('visible', false);

            title.setAttribute('value', 'Public Library Rules');

            message_public.setAttribute('visible', true);
            message_special.setAttribute('visible', false);

            arrowNext.setAttribute('visible', false);
            arrowBackText.setAttribute('value', 'HomePage');
          } else if (pageIndex === 2) {
            // 专门图书馆规则页
            bg.setAttribute('src', './img/bg_special.jpg');

            model_home.setAttribute('visible', false);
            model_public.setAttribute('visible', false);
            model_special.setAttribute('visible', true);

            title.setAttribute('value', 'Special Library Rules');

            message_public.setAttribute('visible', false);
            message_special.setAttribute('visible', true);

            arrowNext.setAttribute('visible', false);
            arrowBackText.setAttribute('value', 'HomePage');
          }
        }

      });


    </script>
  </body>
</html>
