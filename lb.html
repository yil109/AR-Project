<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Library AR - Book Card</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <!-- Book Marker -->
    <a-marker preset="hiro">

      <!-- 卡片背景 -->
      <a-plane
        position="0 0.8 0"
        rotation="-90 0 0"
        width="1.4"
        height="1.8"
        color="#FFFFFF"
        material="opacity: 0.9"
      >

        <!-- 标题 -->
        <a-text
          value="📘 Book Borrowing"
          position="0 0.7 0.01"
          align="center"
          width="1.3"
          color="#222"
        ></a-text>

        <!-- 正文 -->
        <a-text
          value="Borrowing Rules:\n• 30 days\n• Return at 1F desk\n\nBook Areas:\n• General Library\n• Special Library\n\nSearch:\n• 2F OPAC system"
          position="0 0.1 0.01"
          align="left"
          width="1.2"
          color="#333"
          wrap-count="30"
        ></a-text>

      </a-plane>

    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
